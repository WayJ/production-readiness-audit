<body>
<header class="topbar">
  <div class="wrap top-main">
    <a class="brand" href="#overview" aria-label="返回报告概览"><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span><span>软件工程审查<small>ENGINEERING REVIEW</small></span></a>
    <div class="top-actions"><span class="top-version" id="top-version"></span><button class="btn primary" id="print-button" type="button">打印 / 保存 PDF</button></div>
  </div>
  <nav class="wrap nav" aria-label="报告目录"><a href="#overview">审查概览</a><a href="#dimensions">维度评分</a><a href="#findings">扣分与问题</a><a href="#unknowns">待验证项</a><a href="#baseline">交付基线</a><a href="#evidence">证据索引</a><a href="#method">评分口径</a></nav>
</header>
<main class="wrap main" id="report-root">
  <noscript><div class="fatal">本报告需要浏览器启用 JavaScript 才能展示本地报告数据。所有内容均已保存在此 HTML 文件中，不需要连接网络。</div></noscript>
</main>
<script id="report-data" type="application/json">__AUDIT_DATA_JSON__</script>
<script>
(()=>{'use strict';
const root=document.getElementById('report-root');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=value=>Array.isArray(value)?value:[];
const finite=value=>typeof value==='number'&&Number.isFinite(value);
const num=value=>finite(value)?value:0;
const fmt=value=>finite(value)?String(value):'—';
const percent=value=>Math.min(100,Math.max(0,num(value)));
const text=value=>String(value??'').trim()||'待补充';
let data;
try{data=JSON.parse(document.getElementById('report-data').textContent);if(!data||typeof data!=='object'||!data.summary)throw new Error('缺少有效的报告数据或评分结果');}
catch(error){root.innerHTML='<div class="fatal"><h2>报告数据尚未就绪</h2><p>此文件为固定模板，需要填入经过校验的审查数据后生成正式报告。</p><p>'+esc(error.message)+'</p></div>';document.getElementById('print-button').disabled=true;return;}
const meta=data.meta||{},summary=data.summary||{},baseline=data.baseline||{};
const dimensions=arr(summary.dimensions),findings=arr(data.findings),checks=arr(data.checks),evidence=arr(data.evidence);
const dimensionMap=new Map(dimensions.map(d=>[String(d.id),d]));
const findingMap=new Map(findings.map((f,i)=>[String(f.id),{...f,anchor:'finding-'+i}]));
const evidenceMap=new Map(evidence.map((e,i)=>[String(e.id),{...e,anchor:'evidence-'+i}]));
const checkMap=new Map(checks.map((c,i)=>[String(c.id),{...c,anchor:'check-'+i}]));
const deductionMap=new Map(arr(summary.finding_deductions).map(d=>[String(d.id),d]));
const unknownChecks=checks.filter(c=>c.status==='unknown');
const criticalUnknownIds=new Set(arr(summary.critical_unknowns).map(String));
const criticalUnknownChecks=unknownChecks.filter(c=>c.critical===true||criticalUnknownIds.has(String(c.id)));
const ordinaryUnknownChecks=unknownChecks.filter(c=>!(c.critical===true||criticalUnknownIds.has(String(c.id))));
const typeLabels={vulnerability:'安全漏洞',bug:'一般 Bug',architecture:'架构问题',organization:'代码组织',verification:'验证缺口'};
const severityLabels={critical:'致命',high:'严重',medium:'中等',low:'轻微'};
const statusLabels={pass:'已满足',fail:'确认不满足',unknown:'待验证',na:'不适用'};
const statusTones={pass:'teal',fail:'red',unknown:'amber',na:'outline'};
const severityClass=value=>Object.hasOwn(severityLabels,value)?value:'medium';
const blocked=arr(summary.confirmed_blockers).length>0;
const complete=summary.status==='complete'&&finite(summary.score);
const partial=summary.status==='partial';
const cap=finite(summary.blocker_cap)?summary.blocker_cap:null;
const scoreDisplay=complete?fmt(summary.score):(partial&&finite(summary.provisional_upper)?'≤ '+fmt(summary.provisional_upper):'未评估');
const scoreClass=complete?'':(partial?'interval':'no-score');
const gradeTone=blocked?'bad':complete?(summary.score>=80?'good':summary.score>=60?'warn':'bad'):'warn';
const totalConfirmed=findings.filter(f=>f.status==='confirmed').length;
const confirmedVulns=findings.filter(f=>f.status==='confirmed'&&f.type==='vulnerability').length;
const confirmedBugs=findings.filter(f=>f.status==='confirmed'&&f.type==='bug').length;
const structural=findings.filter(f=>f.status==='confirmed'&&['architecture','organization'].includes(f.type)).length;
const unknownFindings=findings.filter(f=>f.status==='unknown').length;
const dName=id=>dimensionMap.get(String(id))?.name||String(id||'未分类');
function badge(label,tone=''){return '<span class="badge '+tone+'">'+esc(label)+'</span>';}
function evidenceLinks(ids){const values=arr(ids);return values.length?'<div class="evidence-links">'+values.map(id=>{const item=evidenceMap.get(String(id));return item?'<a class="evidence-link" href="#'+item.anchor+'">'+esc(id)+'</a>':'<span class="badge outline">'+esc(id)+' · 未提供条目</span>';}).join('')+'</div>':'';}
function list(values,cls=''){const items=arr(values);return items.length?'<ul'+(cls?' class="'+cls+'"':'')+'>'+items.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':'<p class="muted">尚未提供。</p>';}
function empty(title,description){return '<div class="empty-state"><strong>'+esc(title)+'</strong>'+esc(description)+'</div>';}
function field(label,content,extra=''){return '<div class="field '+extra+'"><div class="field-label">'+esc(label)+'</div>'+content+'</div>';}
function dimensionRows(){return dimensions.map(d=>{
const state={complete:'已完成',partial:'暂评上限',unreviewed:'未评估',not_applicable:'不适用'}[d.status]||'未评估';
const value=finite(d.score)?fmt(d.score):(finite(d.provisional_score)?'≤ '+fmt(d.provisional_score):'—');
return `<tr><td><button type="button" class="dimension-button" data-dimension="${esc(d.id)}"><span class="dimension-letter">${esc(d.id)}</span><span><span class="dimension-name">${esc(d.name)}</span><small>固定权重 ${fmt(d.weight)}% · 有效 ${fmt(d.effective_weight)}%</small></span></button></td><td><span class="earned">${value}<small>/ 100</small></span><div class="muted">${state}</div></td><td><div class="stack"><span class="pass" style="width:${finite(d.provisional_score)?num(d.provisional_score):0}%"></span><span class="fail" style="width:${num(d.deducted)}%"></span><span class="unknown" style="width:${d.status==='unreviewed'?100:0}%"></span></div><small class="muted">累计扣分 ${fmt(d.raw_deduction)} / 实扣 ${fmt(d.deducted)}</small></td><td class="score-cell fail">−${fmt(d.weighted_deduction)}</td><td class="score-cell pending">${fmt(d.unknown)} 项</td><td class="score-cell muted">${fmt(d.coverage)}%<small style="display:block">${d.reviewed}/${d.applicable} 指标</small></td></tr>`;
}).join('');}
function findingHtml(f,index){const deduction=deductionMap.get(String(f.id))||{};const points=num(deduction.points),pending=num(deduction.pending_points);const status=f.status==='confirmed'?'已确认':'待验证';const related=checks.filter(c=>arr(c.finding_ids).includes(f.id));const pointMarkup=points>0?'<div class="issue-points">−'+fmt(points)+'<small>维度内扣分 / 100</small></div>':pending>0?'<div class="issue-points pending">'+fmt(pending)+'<small>待验证分值 · 未扣分</small></div>':'<div class="issue-points none">—<small>未产生直接扣分</small></div>';
const charges='<p>扣分依据：'+esc(deduction.policy_basis||'尚未确认，不扣分')+'；总分影响（维度封底前）：−'+fmt(deduction.weighted_impact_before_cap)+' 分。</p><p>'+esc(f.severity_reason)+'</p><div class="check-charges">'+related.map(c=>'<a class="charge" href="#'+checkMap.get(String(c.id)).anchor+'">'+esc(c.id)+' · '+esc(statusLabels[c.status])+'</a>').join('')+'</div><p class="tiny-note">一个根因可命中多个指标，只在主维度扣一次。维度最多扣100分；上述总分影响为封底前单项值。</p>'+(f.blocker?'<div class="impact-box"><strong>阻断规则 '+esc(f.blocker_rule_id)+'</strong><p>'+esc(f.blocker_reason)+'</p></div>':'');
return '<details class="issue-card sev-'+severityClass(f.severity)+'" id="finding-'+index+'" data-finding-index="'+index+'"'+(index===0&&f.blocker?' open':'')+'><summary><div class="issue-main"><div class="issue-topline"><span class="issue-id">'+esc(f.id)+'</span>'+badge(typeLabels[f.type]||f.type||'问题','navy')+badge(severityLabels[f.severity]||'待定',(f.severity==='critical'||f.severity==='high')?'red':f.severity==='medium'?'amber':'outline')+badge(status,f.status==='confirmed'?'teal':'amber')+(f.blocker?badge('上线阻断','red'):'')+'</div><div class="issue-title">'+esc(f.title)+'</div><div class="issue-dim">'+esc(dName(f.dimension_id))+(f.priority?' · '+esc(f.priority):'')+'</div></div><div class="issue-right">'+pointMarkup+'<span class="chevron" aria-hidden="true"></span></div></summary><div class="issue-content"><div class="issue-fields">'+field('扣分 / 判断原因','<p>'+esc(text(f.cause))+'</p>')+field('触发条件','<p>'+esc(text(f.trigger))+'</p>')+field('影响与范围','<div class="impact-box"><p>'+esc(text(f.impact))+'</p>'+(arr(f.scope).length?'<div class="scope-tags">'+arr(f.scope).map(s=>'<span>'+esc(s)+'</span>').join('')+'</div>':'')+'</div>','full')+field('代码位置与证据','<div class="location-list">'+(arr(f.locations).length?arr(f.locations).map(s=>'<code>'+esc(s)+'</code>').join(''):'<p class="muted">尚未提供位置。</p>')+'</div>'+evidenceLinks(f.evidence_ids))+field('验证 / 复现过程',arr(f.reproduction).length?'<ol>'+arr(f.reproduction).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>':'<p class="muted">尚未提供；不得据此声称已运行复现。</p>')+field('最小处理建议','<div class="recommendation"><p>'+esc(text(f.suggestion))+'</p></div>')+field('完成后的复验标准','<div class="acceptance"><p>'+esc(text(f.acceptance))+'</p></div>')+field('扣分依据与关联指标',charges,'full')+'</div></div></details>';}
function unknownHtml(){
if(!unknownChecks.length)return empty('当前没有登记待验证项','这只说明本报告未登记未知条目，不代表未检查范围已经通过。');
const group=(items,critical)=>'<div class="unknown-group"><div class="unknown-group-head"><h3>'+ (critical?'关键待验证项':'普通待验证项')+'</h3>'+badge(items.length+' 项',critical?'amber':'outline')+'</div>'+(items.length?'<div class="unknown-grid">'+items.map(check=>{const finding=arr(check.finding_ids).length?findingMap.get(String(check.finding_ids[0])):null;return '<article class="unknown-card"><div class="unknown-head"><h3>'+esc(check.id)+' · '+esc(check.criterion)+'</h3>'+badge(critical?'关键条件未验证':'待补充验证',critical?'amber':'outline')+'</div><p>'+esc(check.reason||'尚缺足够证据，无法作出通过或失败的判断。')+'</p>'+(finding&&finding.suggestion?'<p style="margin-top:8px">'+esc(finding.suggestion)+'</p>':'')+'<div class="unknown-foot"><span>待验证指标 · 未扣分</span>'+(finding?'<a href="#'+finding.anchor+'">'+esc(finding.id)+' · 查看验证项 →</a>':'<span>未关联问题条目</span>')+'</div></article>';}).join('')+'</div>':'<p class="muted" style="font-size:12px">当前未登记此类待验证项；未覆盖范围仍需结合诊断限制阅读。</p>')+'</div>';
return group(criticalUnknownChecks,true)+group(ordinaryUnknownChecks,false);
}
function checksRows(){return checks.map((c,i)=>'<tr id="check-'+i+'"><td><span class="check-id">'+esc(c.id)+'</span>'+(c.critical?'<div>'+badge('关键验证','outline')+'</div>':'')+'</td><td class="check-id">'+esc(c.criterion)+'<div class="muted" style="white-space:normal">'+esc(c.requirement)+'</div></td><td>'+badge(statusLabels[c.status],statusTones[c.status])+'</td><td class="reason">'+esc(c.reason)+'<div class="muted">范围：'+esc(arr(c.scope_refs).join('、'))+'</div></td><td>'+evidenceLinks(c.evidence_ids)+arr(c.finding_ids).map(id=>'<a class="check-link" href="#'+findingMap.get(id).anchor+'">'+esc(id)+' →</a>').join(' ')+'</td></tr>').join('');}
function evidenceHtml(){return evidence.length?'<div class="evidence-grid">'+evidence.map((e,i)=>'<article class="evidence-card" id="evidence-'+i+'"><div class="evidence-header"><strong>'+esc(e.id)+'</strong><span>'+esc(e.method||'证据类型待定')+'</span></div><div class="evidence-location">'+esc(text(e.location))+'</div><div class="evidence-pair"><span>预期</span><p>'+esc(text(e.expected))+'</p></div><div class="evidence-pair"><span>观察</span><p>'+esc(text(e.observed))+'</p></div><div class="evidence-pair"><span>限制</span><p>'+esc(e.limitations||'未单独记录；以报告范围为准。')+'</p></div></article>').join('')+'</div>':empty('尚未附上证据','正式审查需记录可定位的代码、执行结果或平台证据；模板本身不构成项目通过的证明。');}
let scoreNote=summary.status==='unscored'?'尚未形成可计分的审查证据；不默认100分。':complete?'已完成本次约定范围的检查，不代表未发现范围绝对安全。':'这是基于已确认扣分的暂评上限，不是最终分数；未知不是确认扣分。';
if(cap!==null)scoreNote+=' 基础'+(complete?'分':'暂评上限')+' <strong>'+fmt(summary.raw_score)+'</strong>；确认技术阻断使上限为 <strong>'+fmt(cap)+'</strong>，封顶差额不冒充扣分项。';
const scoreStatusLabel=complete?'已完成计分':partial?'暂评上限 · 审查未完成':'尚未评估';
root.innerHTML=(meta.is_demo?'<div class="demo-banner"><span class="demo-dot" aria-hidden="true"></span><div><strong>示例数据 · 非真实项目审查</strong><br>本页用于展示固定报告的结构、评分与问题展开效果。项目、代码位置、证据和问题均为演示内容。</div></div>':'')+
`<section id="overview"><div class="report-head"><div><div class="eyebrow">SOFTWARE ENGINEERING REVIEW / DEDUCTION MODEL</div><h1 id="report-title">${esc(meta.title)}</h1><div class="project-line"><span>${esc(meta.project)}</span><span>${esc(meta.version)}</span></div></div><div class="head-meta"><div><span>审查时间</span><strong>${esc(meta.reviewed_at)}</strong></div><div><span>代码快照</span><strong class="mono">${esc(meta.snapshot)}</strong></div><div><span>验证环境</span><strong>${esc(meta.environment)}</strong></div></div></div><div class="overview-grid"><article class="score-card"><div class="card-kicker"><span>技术就绪评分</span><span>${scoreStatusLabel}</span></div><div class="score"><strong class="${scoreClass}">${esc(scoreDisplay)}</strong>${summary.status!=='unscored'?'<span>/ 100</span>':''}</div><div class="grade-line"><span class="grade-chip ${gradeTone}">${esc(summary.grade)}</span></div><div class="score-note">${scoreNote}</div></article><div class="metric-grid"><article class="metric"><div class="metric-label">检查完成度<span>按原始指标计数</span></div><div class="metric-value value-teal">${fmt(summary.coverage)}<small>%</small></div><div class="metric-sub">${summary.reviewed_criteria} / ${summary.applicable_criteria} 个适用指标；不参与加分</div></article><article class="metric"><div class="metric-label">确认扣分<span>折合综合总分</span></div><div class="metric-value value-red">${fmt(summary.weighted_deduction)}<small>分</small></div><div class="metric-sub">${totalConfirmed} 个确认根因；同一根因只扣一次</div></article><article class="metric"><div class="metric-label">确认技术阻断<span>独立于扣分</span></div><div class="metric-value value-red">${summary.confirmed_blockers.length}<small>项</small></div><div class="metric-sub">严重度不自动等于阻断，须匹配阻断规则</div></article><article class="metric"><div class="metric-label">待验证指标<span>不算已确认缺陷</span></div><div class="metric-value value-amber">${summary.unknown_count}<small>项</small></div><div class="metric-sub">关键 ${summary.critical_unknowns.length} 项；不以大量低风险检查替代关键验证</div></article></div></div><div class="conclusion ${blocked?'blocked':''}"><h3>审查结论</h3><p>${esc(data.conclusion)}</p></div></section>`+
`<section class="section" id="dimensions"><div class="section-head"><div><div class="section-title"><span class="section-number">01</span><h2>各维度评分</h2></div><div class="section-desc">每维度满分100，按确认问题扣分，再按固定维度权重汇总。点击维度筛选问题。</div></div><div class="section-note">量表 ${esc(data.rubric_version)} / 策略 ${esc(data.policy_version)}<br>指标无分值，不需要合计100</div></div><div class="panel"><div class="table-scroll"><table class="dimensions-table"><thead><tr><th>技术维度与权重</th><th>维度得分</th><th>维度内扣分</th><th>总分扣分</th><th>待验证</th><th>检查完成度</th></tr></thead><tbody>${dimensionRows()}</tbody></table></div><div class="table-foot"><div class="sum-line"><span>综合基础${complete?'分':'暂评上限'} <strong>${fmt(summary.raw_score)}</strong></span><span>确认扣分 <strong>${fmt(summary.weighted_deduction)}</strong></span><span>待验证 <strong>${summary.unknown_count} 项</strong></span><span>不适用 <strong>${summary.na_count} 项</strong></span></div></div></div><p class="tiny-note">未检查不显示正式100分。检查完成度按原始指标而非子检查数量计算；覆盖度不是质量分。全部指标有理由不适用的维度才从综合分母剔除，并公开有效权重。本报告剔除维度：${esc(summary.excluded_dimensions.join('、')||'无')}。</p></section>`+
'<section class="section" id="findings" aria-labelledby="findings-title"><div class="section-head"><div><div class="section-title"><span class="section-number">02</span><h2 id="findings-title">扣分项与问题详情</h2></div><div class="section-desc">每个问题均可追溯到技术要求、证据与复验标准。</div></div><div class="issue-stats">'+badge('漏洞 '+confirmedVulns,'red')+badge('Bug '+confirmedBugs,'navy')+badge('结构问题 '+structural,'navy')+badge('待验证 '+unknownFindings,'amber')+'</div></div><div class="filter-panel no-print"><div class="filter-grid"><div class="filter-field"><label for="filter-search">搜索问题、代码位置或建议</label><input id="filter-search" type="search" placeholder="例如：重复提交、公共组件、越权" autocomplete="off"></div><div class="filter-field"><label for="filter-dimension">评分维度</label><select id="filter-dimension"><option value="">全部维度</option>'+dimensions.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.name)+'</option>').join('')+'</select></div><div class="filter-field"><label for="filter-severity">严重程度</label><select id="filter-severity"><option value="">全部程度</option><option value="critical">致命</option><option value="high">严重</option><option value="medium">中等</option><option value="low">轻微</option></select></div><div class="filter-field"><label for="filter-status">证据状态</label><select id="filter-status"><option value="">全部状态</option><option value="confirmed">已确认</option><option value="unknown">待验证</option></select></div><div class="filter-field"><label for="filter-blocker">上线影响</label><select id="filter-blocker"><option value="">全部问题</option><option value="yes">仅确认阻断</option><option value="no">非阻断问题</option></select></div></div><div class="filter-bottom"><div class="filter-count" id="filter-count" aria-live="polite"></div><div class="filter-actions"><button class="btn text" id="reset-filters" type="button">重置筛选</button><button class="btn text" id="expand-all" type="button">展开结果</button><button class="btn text" id="collapse-all" type="button">收起结果</button></div></div></div><div class="issue-list" id="issue-list">'+findings.map(findingHtml).join('')+'</div><div id="no-findings"'+(findings.length?' hidden':'')+'>'+empty(findings.length?'没有符合筛选条件的问题':'尚未登记问题',findings.length?'调整筛选条件或重置筛选，查看完整问题清单。':'尚未登记不等于已验证通过，请结合检查明细与证据覆盖情况。')+'</div><div class="print-meta">打印视图包含全部问题、完整详情与检查记录，不受屏幕筛选条件影响。</div></section>'+
'<section class="section" id="unknowns" aria-labelledby="unknown-title"><div class="section-head"><div><div class="section-title"><span class="section-number">03</span><h2 id="unknown-title">待验证项</h2></div><div class="section-desc">这些条目尚无充分结论，不能写成已确认缺陷，也不能视为通过。</div></div><div class="section-note">'+criticalUnknownChecks.length+' 项关键 / '+ordinaryUnknownChecks.length+' 项普通</div></div>'+unknownHtml()+'</section>'+
'<section class="section" id="baseline" aria-labelledby="baseline-title"><div class="section-head"><div><div class="section-title"><span class="section-number">04</span><h2 id="baseline-title">交付基线与检查范围</h2></div><div class="section-desc">评分绑定具体功能、版本、使用条件与验证环境。</div></div>'+badge(data.baseline_ready?'基线已建立':'基线待建立',data.baseline_ready?'teal':'amber')+'</div><div class="baseline-grid"><div class="panel inner-panel"><h3 class="subhead">本次功能范围</h3>'+list(baseline.scope,'scope-list')+'</div><div class="panel"><table class="conditions-table"><tbody>'+arr(baseline.conditions).map(c=>'<tr><th>'+esc(c.label)+'</th><td>'+esc(c.value)+'<span class="condition-status">'+esc(c.status||'确认状态待补充')+'</span><span class="condition-status">来源：'+esc(c.source||'未提供来源')+'</span></td></tr>').join('')+'</tbody></table></div></div>'+(arr(baseline.key_flows).length?'<div class="flow-grid">'+arr(baseline.key_flows).map(f=>'<article class="flow-card"><div class="flow-top"><span class="issue-id">'+esc(f.id)+'</span>'+badge(f.status||'待检查','outline')+'</div><div class="flow-name">'+esc(f.name)+'</div><p>'+esc(f.expected)+'</p>'+evidenceLinks(f.evidence_ids)+'</article>').join('')+'</div>':'')+'<div class="limitation-box"><h3>未覆盖范围与诊断限制</h3>'+list(baseline.limitations)+'</div><details class="panel checks-wrap" id="all-checks"><summary>全部检查明细 · '+checks.length+' 项（含通过、扣分、待验证与不适用）</summary><div class="table-scroll"><table class="checks-table"><thead><tr><th>检查编号</th><th>量表项</th><th>状态</th><th>判断依据 / 不适用理由</th><th>证据与关联问题</th></tr></thead><tbody>'+checksRows()+'</tbody></table></div></details></section>'+
'<section class="section" id="evidence" aria-labelledby="evidence-title"><div class="section-head"><div><div class="section-title"><span class="section-number">05</span><h2 id="evidence-title">证据索引</h2></div><div class="section-desc">分别记录检查方式、预期、实际观察与适用边界。</div></div><div class="section-note">'+evidence.length+' 条证据</div></div>'+evidenceHtml()+'</section>'+
`<section class="section" id="method"><div class="section-head"><div class="section-title"><span class="section-number">06</span><h2>评分口径与可追溯性</h2></div></div><div class="panel inner-panel"><div class="method-grid"><div><h3 class="subhead">固定维度，问题扣分</h3><p>指标只定义检查要求；通过检查不加分。默认轻微/中等/严重/致命分别在主维度扣3/10/20/40分。同一根因合并，多次命中只扣一次；独立根因即使命中同一指标也分别扣分。</p><div class="formula">维度分 = max(0, 100 − 确认问题扣分之和)<br>综合分 = Σ(维度分 × 有效权重)</div><div class="grade-scale"><div><strong>80–100</strong>良好</div><div><strong>60–&lt;80</strong>合格</div><div><strong>&lt;60</strong>不合格</div></div><p>确认阻断按策略封顶；封顶不是重复扣分。分数不是发布许可。</p></div><div><h3 class="subhead">未知、适用性与版本</h3><p>未检查不默认100分；部分检查只显示暂评上限，不生成正式等级。未知不扣分，也不能因难以验证就改为不适用。管理责任、签字、交接、文档数量和架构偏好均不计分。</p><p>每份报告内嵌量表与扣分策略快照。变更指标须更新量表版本；历史报告不自动重算。</p><p class="tiny-note">量表 SHA-256：<code style="overflow-wrap:anywhere">${esc(summary.rubric_sha256)}</code></p><p class="tiny-note">策略 SHA-256：<code style="overflow-wrap:anywhere">${esc(summary.policy_sha256)}</code></p></div></div></div></section>`+
'<footer class="report-footer"><span>'+esc(meta.project||'项目待指定')+' · '+esc(meta.version||'版本待定')+' · '+esc(meta.reviewed_at||'日期待填写')+'</span><span>固定报告模板 '+esc(meta.template_version||'2.1.0')+' · '+(meta.is_demo?'示例内容，不代表真实项目结论':'结论限于本次代码快照、适用条件与检查范围')+'</span></footer>';
document.title=(meta.is_demo?'【示例】':'')+(meta.project?meta.project+' · ':'')+(meta.title||'软件工程质量审查报告');
document.getElementById('top-version').textContent='报告 '+(meta.version||'—')+' · 模板 '+(meta.template_version||'2.1.0');
const controls={search:document.getElementById('filter-search'),dimension:document.getElementById('filter-dimension'),severity:document.getElementById('filter-severity'),status:document.getElementById('filter-status'),blocker:document.getElementById('filter-blocker')};
const cards=[...document.querySelectorAll('.issue-card')];
const searchable=findings.map(f=>JSON.stringify(f).toLocaleLowerCase());
function applyFilters(){const query=controls.search.value.trim().toLocaleLowerCase();let visible=0;cards.forEach((card,i)=>{const f=findings[i];const show=(!query||searchable[i].includes(query))&&(!controls.dimension.value||String(f.dimension_id)===controls.dimension.value)&&(!controls.severity.value||f.severity===controls.severity.value)&&(!controls.status.value||f.status===controls.status.value)&&(!controls.blocker.value||(controls.blocker.value==='yes'?Boolean(f.blocker)&&f.status==='confirmed':!(Boolean(f.blocker)&&f.status==='confirmed')));card.hidden=!show;if(show)visible++;});document.getElementById('filter-count').textContent='显示 '+visible+' / '+findings.length+' 项问题';document.getElementById('no-findings').hidden=visible>0;}
for(const control of Object.values(controls))control.addEventListener(control===controls.search?'input':'change',applyFilters);
document.getElementById('reset-filters').addEventListener('click',()=>{Object.values(controls).forEach(control=>control.value='');applyFilters();});
document.getElementById('expand-all').addEventListener('click',()=>cards.filter(card=>!card.hidden).forEach(card=>card.open=true));
document.getElementById('collapse-all').addEventListener('click',()=>cards.filter(card=>!card.hidden).forEach(card=>card.open=false));
document.querySelectorAll('[data-dimension]').forEach(button=>button.addEventListener('click',()=>{Object.values(controls).forEach(control=>control.value='');controls.dimension.value=button.dataset.dimension;applyFilters();document.getElementById('findings').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));
function revealAnchor(){let id;try{id=decodeURIComponent(window.location.hash.slice(1));}catch{return;}if(!id)return;const target=document.getElementById(id);if(!target)return;if(target.matches('.issue-card')){if(target.hidden){Object.values(controls).forEach(control=>control.value='');applyFilters();}target.open=true;}const details=target.closest('details');if(details)details.open=true;}
window.addEventListener('hashchange',revealAnchor);
let printState=null;
function beforePrint(){if(printState)return;printState={details:[...document.querySelectorAll('details')].map(el=>[el,el.open]),hidden:cards.map(el=>[el,el.hidden]),empty:document.getElementById('no-findings').hidden};printState.details.forEach(([el])=>el.open=true);cards.forEach(el=>el.hidden=false);document.getElementById('no-findings').hidden=findings.length>0;}
function afterPrint(){if(!printState)return;const saved=printState;printState=null;saved.details.forEach(([el,open])=>el.open=open);saved.hidden.forEach(([el,hidden])=>el.hidden=hidden);document.getElementById('no-findings').hidden=saved.empty;}
window.addEventListener('beforeprint',beforePrint);window.addEventListener('afterprint',afterPrint);
document.getElementById('print-button').addEventListener('click',()=>{beforePrint();try{window.print();}catch(error){afterPrint();throw error;}});
applyFilters();revealAnchor();
})();
</script>
</body>
</html>
